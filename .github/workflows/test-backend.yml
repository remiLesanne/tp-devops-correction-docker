name: Test backend

on:
  # tests lancés à chaque push sur main et develop
  push:
    branches:
      - main
      - develop
  # et à chaque pull request
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # récupère le code du dépôt
      - uses: actions/checkout@v4

      # installe Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # compile et lance les tests unitaires et d'intégration
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml

      # analyse la qualité du code avec SonarCloud
      - name: SonarCloud analysis
        run: mvn -B verify sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }} --file ./simple-api/pom.xml