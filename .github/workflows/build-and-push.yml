name: Build and push Docker images

on:
  # se déclenche quand le workflow "Test backend" se termine
  workflow_run:
    workflows: ["Test backend"]
    types:
      - completed
    # uniquement quand les tests ont tourné sur main
    branches:
      - main

jobs:
  build-and-push-docker-image:
    # ne s'exécute que si les tests ont réussi
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      # récupère exactement le commit qui vient d'être testé
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # connexion à Docker Hub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # construit et publie l'image du backend
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp-devops-simple-api:latest
          push: true

      # construit et publie l'image de la base de données
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp-devops-database:latest
          push: true

      # construit et publie l'image du serveur http
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp-devops-httpd:latest
          push: true

      # construit et publie l'image du front
      - name: Build image and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp-devops-front:latest
          push: true

  deploy:
    # ne démarre qu'une fois les images publiées sur DockerHub
    needs: build-and-push-docker-image
    runs-on: ubuntu-24.04

    steps:
      # récupère le même commit (et donc le dossier ansible/)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # installe Ansible (avec la collection community.docker)
      - name: Install Ansible
        run: pipx install --include-deps ansible

      # écrit la clé SSH depuis le secret et enregistre l'empreinte du serveur
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H remi.lesanne.takima.school >> ~/.ssh/known_hosts

      # lance le playbook en déchiffrant le vault avec le secret GitHub
      - name: Deploy with Ansible
        working-directory: ./ansible
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > vault_pass.txt
          ansible-playbook -i inventories/setup.yml playbook.yml \
            -e "ansible_ssh_private_key_file=$HOME/.ssh/id_rsa" \
            --vault-password-file vault_pass.txt
          rm -f vault_pass.txt