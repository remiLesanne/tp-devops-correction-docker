---
# Prérequis pour Docker
- name: Install required packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-venv
    state: latest
    update_cache: yes

# Dossier qui contiendra la clé GPG de Docker
- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# Clé GPG officielle de Docker
- name: Add Docker GPG key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

# Dépôt APT de Docker
- name: Add Docker APT repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable"
    state: present
    update_cache: yes

# Installation de Docker
- name: Install Docker
  apt:
    name: docker-ce
    state: present

# Python3 et pip
- name: Install Python3 and pip3
  apt:
    name:
      - python3
      - python3-pip
    state: present

# SDK Docker pour Python, dans un environnement virtuel
- name: Install Docker SDK for Python in virtual environment
  pip:
    name: docker
    virtualenv: /opt/docker_venv
    virtualenv_command: python3 -m venv

# Docker doit tourner
- name: Make sure Docker is running
  service:
    name: docker
    state: started
  tags: docker
